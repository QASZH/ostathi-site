<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتجر الرقمي | إتمام الدفع</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .checkout-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 768px) {
      .checkout-grid { grid-template-columns: 1fr; }
    }
    .payment-options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .payment-option {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .payment-option input {
      cursor: pointer;
    }
    .payment-option:hover {
      background-color: var(--secondary-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav-content">
      <div class="logo">المتجر الرقمي</div>
      <nav class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="products.html">المنتجات</a>
      </nav>
      <div class="nav-icons">
        <a href="cart.html" title="سلة المشتريات">
          🛒 (<span id="cart-count">0</span>)
        </a>
        <div id="auth-links" class="d-flex align-center gap-1"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="mb-2">إتمام الطلب والدفع</h1>

    <div class="checkout-grid" id="checkout-view">
      <!-- Checkout form and summary will be rendered here via JS -->
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2024 المتجر الرقمي. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <script type="module">
    import { getCart, getCartTotal, clearCart, updateCartCountUI } from './js/cart.js';
    import { requireLogin, updateAuthUI } from './js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      // User MUST be logged in to checkout
      if (!requireLogin()) return;

      updateAuthUI();
      updateCartCountUI();
      renderCheckout();
    });

    function renderCheckout() {
      const checkoutContainer = document.getElementById('checkout-view');
      const cart = getCart();

      if (cart.length === 0) {
        checkoutContainer.innerHTML = `
          <div style="grid-column: 1 / -1;" class="text-center mt-2">
            <h2>السلة فارغة، لا يمكن إتمام الطلب</h2>
            <a href="products.html" class="btn btn-primary mt-1">العودة للتسوق</a>
          </div>
        `;
        return;
      }

      const formHtml = `
        <div class="card">
          <h3 class="mb-2">معلومات الدفع</h3>
          <form id="checkout-form">
            <div class="form-group">
              <label>الاسم الكامل على البطاقة</label>
              <input type="text" required placeholder="مثال: أحمد محمد">
            </div>

            <h4 class="mb-1">طريقة الدفع</h4>
            <div class="payment-options mb-2">
              <label class="payment-option">
                <input type="radio" name="payment" value="card" checked>
                بطاقة ائتمانية (Visa / MasterCard)
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="mada">
                بطاقة مدى (Mada)
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="paypal">
                باي بال (PayPal)
              </label>
            </div>

            <div id="card-details" class="mt-2">
              <div class="form-group">
                <label>رقم البطاقة</label>
                <input type="text" required placeholder="**** **** **** ****" maxlength="19">
              </div>
              <div class="d-flex gap-1">
                <div class="form-group" style="flex:1;">
                  <label>تاريخ الانتهاء</label>
                  <input type="text" required placeholder="MM/YY" maxlength="5">
                </div>
                <div class="form-group" style="flex:1;">
                  <label>رمز الأمان (CVV)</label>
                  <input type="text" required placeholder="123" maxlength="4">
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">تأكيد الدفع وإتمام الطلب</button>
          </form>
        </div>
      `;

      const total = getCartTotal().toFixed(2);
      const summaryHtml = `
        <div class="checkout-summary card">
          <h3>ملخص الطلب النهائي</h3>
          <div class="summary-row mb-1">
            <span>عدد المنتجات:</span>
            <span>${cart.reduce((acc, item) => acc + item.quantity, 0)}</span>
          </div>
          <div class="summary-total summary-row">
            <span>المبلغ الإجمالي للدفع:</span>
            <span>${total} ريال</span>
          </div>
          <p class="text-center mt-2" style="font-size: 0.8rem; color: #6b7280;">
            بمجرد النقر على تأكيد، سيتم خصم المبلغ وتوفير روابط تحميل المنتجات الرقمية فوراً.
          </p>
        </div>
      `;

      checkoutContainer.innerHTML = formHtml + summaryHtml;

      // Handle Form Submit
      document.getElementById('checkout-form').addEventListener('submit', (e) => {
        e.preventDefault();

        // Simulate payment processing
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.textContent;
        btn.textContent = 'جاري معالجة الدفع...';
        btn.disabled = true;

        setTimeout(() => {
          clearCart();
          alert('تم الدفع بنجاح! شكراً لشرائك من متجرنا. سيتم توجيهك لصفحة تحميل المنتجات قريباً (محاكاة).');
          window.location.href = 'index.html'; // Redirect to home or success page
        }, 2000);
      });

      // Toggle card details based on payment method
      const radios = document.querySelectorAll('input[name="payment"]');
      radios.forEach(radio => {
        radio.addEventListener('change', (e) => {
          const cardDetails = document.getElementById('card-details');
          if (e.target.value === 'paypal') {
            cardDetails.style.display = 'none';
            // Disable card inputs so form can submit without them
            cardDetails.querySelectorAll('input').forEach(input => input.removeAttribute('required'));
          } else {
            cardDetails.style.display = 'block';
            cardDetails.querySelectorAll('input').forEach(input => input.setAttribute('required', 'true'));
          }
        });
      });
    }
  </script>
</body>
</html>
