<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>أستاذي | الجلسة</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    body{height:100vh; overflow:hidden; display:flex; flex-direction:column;}
    .chat-wrap{
      flex:1; max-width:800px; width:100%; margin:0 auto;
      display:flex; flex-direction:column; overflow:hidden;
      position:relative;
    }
    .chat-header{
      padding:16px 20px; border-bottom:1px solid var(--border);
      background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:space-between;
    }
    .chat-body{
      flex:1; overflow-y:auto; padding:20px;
      display:flex; flex-direction:column; gap:16px;
    }
    .msg{
      max-width:80%; padding:12px 16px; border-radius:18px;
      line-height:1.6; font-size:15px; position:relative;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { from{transform:scale(0.9); opacity:0} to{transform:scale(1); opacity:1} }
    .msg.bot{
      align-self:flex-start; background:var(--card);
      border-bottom-right-radius:4px; border:1px solid var(--border);
      color:var(--text);
    }
    .msg.user{
      align-self:flex-end; background:rgba(59,130,246,0.2);
      border-bottom-left-radius:4px; border:1px solid rgba(59,130,246,0.3);
      color:#fff;
    }
    .chat-input{
      padding:16px; border-top:1px solid var(--border);
      background:rgba(0,0,0,0.3); display:flex; gap:10px;
    }
    input[type="text"]{
      flex:1; padding:12px 16px; border-radius:24px; border:1px solid var(--border);
      background:rgba(255,255,255,0.05); color:#fff; outline:none;
    }
    input[type="text"]:focus{border-color:var(--accent);}
    .send-btn{
      width:46px; height:46px; border-radius:50%; border:none;
      background:var(--accent); color:#fff; cursor:pointer;
      display:grid; place-items:center; font-size:20px;
    }
    .typing{font-size:12px; color:var(--muted); margin-top:4px; margin-right:10px; height:18px;}
  </style>
</head>
<body>

  <div class="chat-wrap">
    <div class="chat-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="logo" style="width:36px; height:36px; font-size:20px;">أ</div>
        <div>
          <div style="font-weight:bold; font-size:16px;">أستاذي</div>
          <div style="font-size:12px; color:var(--accent2); display:flex; align-items:center; gap:4px;">
            <span style="width:8px; height:8px; background:currentColor; border-radius:50%; display:inline-block;"></span> متصل الآن
          </div>
        </div>
      </div>
      <a href="index.html" class="btn" style="padding:8px 14px; font-size:13px;">إنهاء</a>
    </div>

    <div class="chat-body" id="chatBody">
      <!-- Messages go here -->
    </div>

    <div class="typing" id="typingIndicator"></div>

    <form class="chat-input" id="chatForm">
      <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." autocomplete="off" />
      <button type="submit" class="send-btn">➤</button>
    </form>
  </div>

  <script type="module">
    import { boot } from "./assets/app.js";
    boot("session");

    // Parse URL
    const params = new URLSearchParams(window.location.search);
    const subject = params.get("s") || "عام";
    const goal = params.get("g") || "تعلم";

    const chatBody = document.getElementById("chatBody");
    const typingInd = document.getElementById("typingIndicator");

    function addMsg(text, isUser){
      const d = document.createElement("div");
      d.className = "msg " + (isUser ? "user" : "bot");
      d.textContent = text;
      chatBody.appendChild(d);
      chatBody.scrollTo(0, chatBody.scrollHeight);
    }

    function simulateBotReply(userText){
      typingInd.textContent = "أستاذي يكتب...";

      // Simple logic to simulate "AI"
      setTimeout(() => {
        typingInd.textContent = "";
        let reply = "ممتاز! خلنا نكمل.";
        if(userText.includes("السلام")) reply = "وعليكم السلام! جاهز نبدأ في " + subject + "؟";
        else if(userText.includes("صعب")) reply = "ولا يهمك، بنبسطها. خذ نفس عميق وحاول مرة ثانية.";
        else if(userText.includes("شرح")) reply = "تمام، بشرح لك النقطة هذي بأسلوب قصة...";
        else if(userText.length < 5) reply = "حلو، كمل...";

        addMsg(reply, false);
      }, 1500 + Math.random()*1000);
    }

    // Initial greeting
    setTimeout(()=>{
      addMsg(`أهلاً بك يا بطل! اخترت: ${subject} (${goal}).`, false);
      setTimeout(()=>{
        addMsg("أنا جاهز تماماً. وش حاب نبدأ فيه اليوم؟", false);
      }, 1000);
    }, 500);

    document.getElementById("chatForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      const inp = document.getElementById("msgInput");
      const txt = inp.value.trim();
      if(!txt) return;

      addMsg(txt, true);
      inp.value = "";
      simulateBotReply(txt);
    });
  </script>
</body>
</html>
